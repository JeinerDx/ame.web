h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;text-transform:uppercase;line-height:.95;margin:0}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
.glass{position:relative;border-radius:18px;background:linear-gradient(150deg,rgba(24,30,42,.92),rgba(14,18,26,.92));box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,rgba(156,196,255,.75),rgba(42,99,184,.85));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none;opacity:.55}
.btn{display:inline-block;border:0;cursor:pointer;color:#fff;font:500 16px Barlow;padding:11px 24px;border-radius:12px;background:linear-gradient(90deg,var(--c2),#3a77d4);box-shadow:0 0 18px rgba(42,99,184,.4)}
.btn.sec{color:var(--bone);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
nav.glass{background:rgba(12,15,22,.97)}nav{position:sticky;top:10px;z-index:5;margin:10px max(16px,5vw) 0;display:flex;gap:24px;align-items:center;padding:8px 18px;overflow-x:auto;white-space:nowrap}
nav img{height:36px;margin-right:auto}nav a{color:var(--mute);font-weight:500}nav a:hover{color:var(--bone)}
main{padding:0 max(18px,5vw)}section{padding:70px 0 6px}
.hero{padding:60px 0 24px}.hero p{color:var(--mute);max-width:44ch;margin:10px 0 0;font-size:19px}
.hero h1{font-size:clamp(80px,17vw,230px);font-weight:800;background:linear-gradient(90deg,#fff,#9cc4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(30px,7vw,72px);overflow-wrap:anywhere;font-weight:800;margin-bottom:22px}
.stage{display:grid;grid-template-columns:300px 1fr 300px;gap:18px}@media(max-width:980px){.stage{grid-template-columns:1fr}}
.card{padding:22px}.card+.card{margin-top:18px}.card h3{font-size:30px;margin:4px 0 8px}.card p{margin:0 0 14px;color:var(--mute);font-size:15px}
.eye{color:var(--c1);font-weight:500}
.cd{display:flex;gap:8px}.cd div{background:rgba(0,0,0,.35);border-radius:10px;padding:8px 10px;text-align:center;min-width:56px}.cd b{display:block;font:800 28px "Barlow Condensed"}.cd span{font-size:12px;color:var(--mute)}
.card .btn{display:block;text-align:center;margin-top:10px}
.feat{min-height:420px;padding:14px;display:flex;flex-direction:column}.feat .med{flex:1}
.med video,.med img{width:100%;height:100%;max-height:520px;object-fit:cover;border-radius:12px;display:block;background:#000}
.slot{min-height:150px;height:100%;display:grid;place-items:center;border-radius:12px;color:var(--mute);background:rgba(0,0,0,.28);text-align:center;padding:12px}
.row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid rgba(255,255,255,.07)}.row i{width:9px;height:9px;border-radius:50%;background:var(--c1);box-shadow:0 0 10px var(--c1)}.row b{margin-right:auto;font-weight:500}.row span{color:var(--mute);font-size:14px}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end}@media(max-width:700px){.pod{grid-template-columns:1fr}}.pod h3{font-size:44px;color:var(--c1)}.pod .card+.card{margin-top:0}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:5px;margin-bottom:18px}.tabs button{font:500 15px Barlow;color:var(--mute);background:none;border:0;border-radius:12px;padding:8px 18px;cursor:pointer}.tabs button[aria-pressed=true]{color:var(--bone);background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(156,196,255,.5)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.item{padding:12px}.item .med{aspect-ratio:16/10}.item .med>*{max-height:none;height:100%}.cap{margin:10px 4px 2px;font-weight:500}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid rgba(255,255,255,.07)}th{color:var(--c1);font-weight:500}td:last-child{font-weight:500}
.day{display:grid;grid-template-columns:100px 1fr;gap:18px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.07)}.day b{font:800 26px "Barlow Condensed";color:var(--c1);text-transform:uppercase}
footer{margin:90px max(16px,5vw) 30px;padding:26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--mute);font-size:15px}
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#07090d;transition:opacity .7s,visibility .7s}#intro.out{opacity:0;visibility:hidden}
#intro .glass{padding:34px 44px;text-align:center;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
#intro img{width:120px;filter:drop-shadow(0 0 22px rgba(42,99,184,.8));animation:pulse 2s ease-in-out infinite}
#intro h3{font-size:44px;margin:12px 0 16px}.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden;width:240px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c2),var(--c1));box-shadow:0 0 12px var(--c2);animation:fill 1.8s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}@keyframes fill{to{width:100%}}@keyframes pulse{50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){#intro,#intro *{animation:none!important;transition:none!important}}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20}
.ed{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:30;overflow:auto;padding:20px;border-radius:0;background:rgba(10,12,18,.97)}
.ed h3{font-size:26px;margin:22px 0 8px;color:var(--c1)}.ed label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
.ed input,.ed select,.ed textarea{width:100%;font:16px Barlow;color:var(--bone);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 10px}
.ed .it{padding:10px;margin:8px 0;border-radius:12px;background:rgba(255,255,255,.04)}.ed .btn{padding:8px 16px;margin:6px 6px 0 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;padding:12px 20px}
.nums{color:var(--c1);font-weight:500;margin:6px 0 0}.rv{max-width:280px;margin-top:10px}.rv .med video{height:auto}
#ck{position:fixed;left:16px;right:16px;bottom:16px;z-index:45;padding:16px 20px;max-width:640px;margin:0 auto}#ck p{margin:0 0 10px;font-size:15px}#ck .btn{margin-right:8px;padding:8px 18px}
.ed input[type=checkbox]{width:auto}
